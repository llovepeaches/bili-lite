[package]
name = "bili-core"
version = "0.1.0"
edition = "2021"
description = "纯 Rust 业务逻辑内核：不依赖 Python，可独立测试，也可被其他语言绑定复用"
license = "MIT"

[lib]
name = "bili_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
