name: Build installers

# 本地是 Linux 沙箱，缺 MSVC / Xcode / 稳定 Android 工具链。
# 这条流水线把所有原生产物的编译统一放到 GitHub 托管 runner 上：
#   android → APK（release 签名）
#   windows → exe 安装程序（Inno Setup）
#   web     → Web 静态产物 + BFF 源码包
#   ios     → 未签名 IPA（默认关闭，需 macOS + Apple 证书）
# 产物既作为 Actions artifact 留存，也直接发布到对应的 GitHub Release。

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter SDK version (project targets 3.0.0 / Dart 2.17)"
        required: false
        default: "3.0.0"
      release_tag:
        description: "Release tag to publish assets to"
        required: false
        default: "bili-lite-v1.3.0"
      publish:
        description: "Upload artifacts to the GitHub Release"
        required: false
        default: "true"
      run_ios:
        description: "Attempt iOS job (needs Flutter >= 3.24.4 for Xcode 16 compatibility)"
        required: false
        default: "false"
      xcode_version:
        description: "Xcode version on the macOS runner (empty = image default). macos-15 ships 16.0~16.4 and 26.x"
        required: false
        default: ""
      publish_testflight:
        description: "Sign with App Store Connect API key and upload to TestFlight (needs Apple Developer Program + ASC secrets)"
        required: false
        default: "false"
  push:
    tags:
      - "bili-lite-v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ inputs.flutter_version || '3.0.0' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'bili-lite-v1.3.0' }}
  PUBLISH: ${{ inputs.publish || 'true' }}

jobs:
  checks:
    name: Static analysis and unit tests
    # 质量守门：analyze / test 不通过就不该产出安装包。
    # 重构前这条流水线只负责"编译"，任何静态错误都要等装到手机上才发现。
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Install Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: flutter pub get
        working-directory: bili-lite/app
        run: flutter pub get

      - name: flutter analyze
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          # --fatal-infos 让警告也失败：重构收敛了风格问题，不该再积累新的。
          flutter analyze --fatal-infos --fatal-warnings

      - name: flutter test
        working-directory: bili-lite/app
        run: flutter test --reporter=expanded

      - name: BFF syntax check and OAuth flow test
        working-directory: bili-lite/server
        run: |
          set -euo pipefail
          npm run check
          npm run verify:oauth

  release:
    name: Ensure release exists
    # gh release upload 在目标 Release 不存在时会直接失败。
    # 首次发版（或换版本号）时目标还不存在，所以先建一个空 Release，
    # 各构建 job 再往里传产物。
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在"
            exit 0
          fi
          version=$(grep -E "^version:" bili-lite/app/pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p")
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "Bili Lite v${version} · Android / Windows / Web" \
            --notes "Bili Lite v${version}：Android APK、Windows 安装程序、Web 静态产物与源码归档。由 GitHub Actions 自动构建。" \
            --target "${{ github.sha }}"
          echo "已创建 Release $RELEASE_TAG"

  source:
    name: Source archives
    # 源码归档此前是手工上传的，与实际提交可能脱节。改为在 CI 里从
    # 同一份 checkout 打包，保证「发布的源码」与「构建产物的源码」一致。
    needs: [checks, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          version=$(grep -E "^version:" bili-lite/app/pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "版本: $version"

      - name: Package source
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          mkdir -p installers
          # 用 git archive 而不是 tar/zip：它只打包**已入库**的文件，
          # 因此不会混进 build/、.dart_tool/、node_modules/ 这些本地产物，
          # 也天然与构建产物同源（同一份 commit）。
          # docs/preview 是 25MB 的截图集，不进源码归档。
          git archive --format=tar.gz --prefix="bili-lite-v${version}-src/" \
            -o "installers/bili-lite-v${version}-src.tar.gz" \
            HEAD bili-lite ':(exclude)bili-lite/docs/preview'
          git archive --format=zip --prefix="bili-lite-v${version}-src/" \
            -o "installers/bili-lite-v${version}-src.zip" \
            HEAD bili-lite ':(exclude)bili-lite/docs/preview'
          ls -la installers/
          echo "--- 内容抽查 ---"
          # 注意：不要用 `| head`，head 提前关闭管道会让 tar 收到 SIGPIPE，
          # 在 set -o pipefail 下整步以非零码结束。
          tar -tzf "installers/bili-lite-v${version}-src.tar.gz" | sed -n "1,5p"

      - uses: actions/upload-artifact@v4
        with:
          name: source-archives
          path: installers/bili-lite-v*-src.*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" installers/bili-lite-v*-src.* \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "已发布源码归档到 $RELEASE_TAG"

  android:
    name: Android release APK
    needs: [checks, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # AGP 4.2.2 官方支持 JDK 8 / 11，这里固定 11。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          # runner 预装了 Android SDK，但 sdkmanager 不在 PATH 里，需要自己定位 cmdline-tools。
          if ! command -v sdkmanager >/dev/null 2>&1; then
            sm=$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sed -n "1p" || true)
            if [ -n "$sm" ]; then
              export PATH="$(dirname "$sm"):$PATH"
            fi
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager: $(command -v sdkmanager || echo 'not found')"
          # compileSdk/targetSdk 由 Flutter 3.0 决定（31），build-tools 30.0.3 是 AGP 4.2.2 的默认版本。
          # 装不上也不直接失败：AGP 仍可自行解析已预装的 platform。
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-31" "build-tools;30.0.3" || \
              echo "::warning::部分 SDK 包安装失败，继续使用 runner 预装版本"
          fi
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Point Flutter at the Android SDK
        run: |
          set -euo pipefail
          flutter config --android-sdk "$ANDROID_HOME"
          flutter doctor -v 2>&1 | grep -iE "android toolchain|android sdk|✗|!" | sed -n "1,20p" || true

      - name: Restore release signing keystore
        run: |
          set -euo pipefail
          dir="$GITHUB_WORKSPACE/bili-lite/app/android"
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > "$dir/bililite-release.jks"
            pass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            alias="${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "使用仓库 Secret 中的正式签名密钥"
          else
            # 没有 Secret 时用一次性密钥，仅保证流水线能跑通，产物不可覆盖升级。
            pass="ci-temporary"
            alias="bililite"
            keytool -genkeypair -v -keystore "$dir/bililite-release.jks" -storetype JKS \
              -storepass "$pass" -keypass "$pass" -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Bili Lite CI, O=Bili Lite, C=CN"
            echo "::warning::未配置 ANDROID_KEYSTORE_B64，本次使用一次性 CI 密钥，产物无法覆盖升级"
          fi
          cat > "$dir/key.properties" <<EOF
          storePassword=$pass
          keyPassword=$pass
          keyAlias=$alias
          storeFile=../bililite-release.jks
          EOF

      - name: Build release APK
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          flutter pub get
          # 不加 OFFLINE：原生端默认直连 B 站公开接口；
          # assets/offline.json 仍会打进包里，断网 / 风控时自动降级。
          flutter build apk --release
          ls -la build/app/outputs/flutter-apk/

      - name: Verify APK signature and contents
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          bt=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $bt"
          "$bt/apksigner" verify --print-certs "$apk" | sed -n "1,6p"
          "$bt/aapt" dump badging "$apk" | grep -E "^package:|^native-code" | sed -n "1,4p"
          unzip -l "$apk" | grep -E "offline.json" || true

      - name: Stage asset
        run: |
          set -euo pipefail
          version=$(grep -E "^version:" bili-lite/app/pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p")
          mkdir -p installers
          cp bili-lite/app/build/app/outputs/flutter-apk/app-release.apk "installers/BiliLite-${version}-Android.apk"
          echo "ASSET_NAME=BiliLite-${version}-Android.apk" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          ls -la installers/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: installers/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "installers/${{ env.ASSET_NAME }}" \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "已发布 ${{ env.ASSET_NAME }} 到 $RELEASE_TAG"

  windows:
    name: Windows x64 installer (exe)
    needs: [checks, release]
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ env.FLUTTER_VERSION }}"
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${ver}-stable.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\flutter.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\flutter.zip" -DestinationPath "$env:RUNNER_TEMP\flutter_sdk" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\flutter_sdk\flutter\bin"
          git config --global --add safe.directory "$env:RUNNER_TEMP\flutter_sdk\flutter"

      - name: Flutter doctor / version
        shell: pwsh
        run: |
          flutter --version
          flutter config --enable-windows-desktop

      - name: Build Windows release (live Bili data + offline fallback)
        working-directory: bili-lite/app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          Get-ChildItem "build\windows\runner\Release" | Select-Object Name, Length

      - name: Ensure Inno Setup available
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "ISCC: $iscc"

      - name: Create exe installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "installers" | Out-Null
          $out = Join-Path $env:GITHUB_WORKSPACE "installers"
          # 版本号从 pubspec 读取，避免 Inno Setup 脚本里的版本与工程脱节。
          $ver = (Select-String -Path "bili-lite\app\pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          Write-Host "AppVersion: $ver"
          $iss = @"
          [Setup]
          AppName=Bili Lite
          AppVersion=$ver
          AppPublisher=Bili Lite
          DefaultDirName={autopf}\Bili Lite
          DefaultGroupName=Bili Lite
          OutputBaseFilename=BiliLite-$ver-Windows-Setup
          OutputDir=$out
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          [Files]
          Source: "bili-lite\app\build\windows\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Bili Lite"; Filename: "{app}\bililite.exe"
          Name: "{autodesktop}\Bili Lite"; Filename: "{app}\bililite.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\bililite.exe"; Description: "{cm:LaunchProgram,Bili Lite}"; Flags: nowait postinstall skipifsilent
          "@
          # Inno Setup 的 Source 相对路径以 .iss 文件所在目录为基准，
          # 必须把脚本放在工作区根，才能引用 bili-lite\app\build\...
          $issPath = Join-Path $env:GITHUB_WORKSPACE "BiliLite.iss"
          Set-Content -Path $issPath -Value $iss -Encoding UTF8
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $iscc $issPath
          Get-ChildItem "installers" | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Select-String -Path "bili-lite\app\pubspec.yaml" -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $asset = "BiliLite-$ver-Windows-Setup.exe"
          # Inno Setup 已按版本号命名产物，无需再做一次拷贝（同名拷贝会报 "cannot overwrite with itself"）。
          if (-not (Test-Path "installers\$asset")) { throw "installer not found: installers\$asset" }
          gh release upload $env:RELEASE_TAG "installers\$asset" --clobber --repo $env:GITHUB_REPOSITORY
          Write-Host "已发布 $asset 到 $env:RELEASE_TAG"

  web:
    name: Web bundle + BFF package
    needs: [checks, release]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Build web release (html renderer)
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release --web-renderer html
          du -sh build/web

      - name: Package web + BFF
        run: |
          set -euo pipefail
          version=$(grep -E "^version:" bili-lite/app/pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p")
          rm -rf staging
          mkdir -p staging/bili-lite-web
          cp -R bili-lite/app/build/web staging/bili-lite-web/web
          cp -R bili-lite/server staging/bili-lite-web/server
          cp bili-lite/README.md staging/bili-lite-web/
          mkdir -p installers
          tar -czf "installers/bili-lite-web-v${version}.tar.gz" -C staging bili-lite-web
          (cd staging && zip -qr "../installers/bili-lite-web-v${version}.zip" bili-lite-web)
          ls -la installers/

      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: installers/bili-lite-web-v*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" installers/bili-lite-web-v*.tar.gz installers/bili-lite-web-v*.zip \
            --clobber --repo "$GITHUB_REPOSITORY"

  ios:
    name: iOS unsigned IPA (build smoke test)
    # 产出未签名 IPA，用于验证 iOS 编译链路本身是否通畅。
    #
    # 实测状态（run 43336509008, 2026-11-13）：
    #   macos-15 + Xcode 16.4 + Flutter 3.0.0 → flutter build ios --release
    #   --no-codesign 成功，110.4s，产出 Runner.app 与 7.29MB 的未签名 IPA。
    #   **不需要升级 Flutter**。
    #
    # 曾经拦路的三个点，都已修好：
    #   * macos-13 已下线、macos-14 已 EOL，镜像里只剩 Xcode 16.x / 26.x；
    #   * Xcode 16 要求 deployment target >= 12.0 —— 工程已统一到 13.0；
    #   * Podfile 里 'Profile' => :profile 是非法值（CocoaPods 只认
    #     :debug / :release），会导致生成 Pods project 时抛
    #     "TypeError - no implicit conversion of nil into Hash"，已改回 :release。
    #
    # 未签名 / ad-hoc 签名 IPA 装不进真机；要可安装的 IPA 请用 ios-testflight job。
    #
    # 注意：这里的开关**故意不用 job 级 if**。
    # GitHub Actions 里「被 needs 依赖且自身被跳过」的 job 会连带把下游 job 一起跳过，
    # 一旦 checksums 依赖 ios，那么 run_ios=false 时校验和与全部产物发布都会被跳过。
    # 所以改成 job 永远运行（恒为 success），由 step 级的 SKIP_IOS 决定是否真的构建。
    needs: [checks, release]
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    env:
      RUN_IOS: ${{ inputs.run_ios || 'false' }}
      PUBLISH: ${{ inputs.publish || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve iOS build switch
        run: |
          set -euo pipefail
          if [ "$RUN_IOS" = "true" ]; then
            echo "SKIP_IOS=false" >> "$GITHUB_ENV"
            echo "run_ios=true，开始 iOS 构建"
          else
            echo "SKIP_IOS=true" >> "$GITHUB_ENV"
            echo "::notice::run_ios 不为 true，跳过 iOS 构建（不影响其它端产物）"
          fi

      - name: Select Xcode
        if: env.SKIP_IOS != 'true'
        run: |
          set -euo pipefail
          want="${{ inputs.xcode_version }}"
          if [ -n "$want" ]; then
            app=$(ls -d "/Applications/Xcode_${want}"*.app 2>/dev/null | sed -n "1p" || true)
            if [ -z "$app" ]; then
              echo "::error::Xcode $want not installed on this image"
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$app"
          fi
          xcodebuild -version
          xcode-select -p

      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Toolchain report
        if: env.SKIP_IOS != 'true'
        run: |
          flutter --version
          ruby --version || true
          pod --version || true
          echo "APPLE_TEAM_ID secret present: ${{ secrets.APPLE_TEAM_ID != '' }}"

      - name: Resolve app version
        if: env.SKIP_IOS != 'true'
        run: |
          version=$(grep -E "^version:" bili-lite/app/pubspec.yaml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | sed -n "1p")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "版本: $version"

      - name: Build iOS release (no codesign)
        if: env.SKIP_IOS != 'true'
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --release --no-codesign --build-number="${GITHUB_RUN_NUMBER}"
          ls -la build/ios/iphoneos/

      - name: Pack unsigned IPA
        if: env.SKIP_IOS != 'true'
        run: |
          set -euo pipefail
          mkdir -p ipa/Payload
          cp -R bili-lite/app/build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa
          zip -qry "BiliLite-${APP_VERSION}-UNSIGNED.ipa" Payload
          unzip -l "BiliLite-${APP_VERSION}-UNSIGNED.ipa" | tail -3

      - name: Pack ad-hoc signed IPA
        if: env.SKIP_IOS != 'true'
        run: |
          set -euo pipefail
          # 未签名的 .app 在 iOS 上连「装都装不上」，侧载工具（AltStore /
          # Sideloadly）也要求 bundle 本身是合法签名的 bundle。
          # 这里用本机自带的 ad-hoc 身份（codesign -s -）做一次自签名：
          # 不需要任何 Apple 凭证，但产出的 IPA 结构合法、可被侧载工具重签。
          APP=bili-lite/app/build/ios/iphoneos/Runner.app
          if [ ! -d "$APP" ]; then
            echo "::error::Runner.app not found"
            exit 1
          fi
          # 签名顺序有讲究：先签 dylib，再签 framework，最后签 .app 本身。
          # 顺序反了会因为引用未签名代码而被拒绝。
          find "$APP/Frameworks" -type f -name "*.dylib" -print0 2>/dev/null \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}" || true
          for fw in "$APP"/Frameworks/*.framework; do
            [ -e "$fw" ] || continue
            codesign --force --sign - --timestamp=none "$fw"
          done
          for plug in "$APP"/PlugIns/*.app "$APP"/PlugIns/*.framework; do
            [ -e "$plug" ] || continue
            codesign --force --sign - --timestamp=none "$plug"
          done
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP" || echo "::warning::深度校验未完全通过"
          echo "--- 签名信息 ---"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n "1,6p"

          rm -rf ipa-adhoc && mkdir -p ipa-adhoc/Payload
          cp -R "$APP" ipa-adhoc/Payload/
          cd ipa-adhoc
          zip -qry "BiliLite-${APP_VERSION}-iOS-ADHOC.ipa" Payload
          ls -la

      - uses: actions/upload-artifact@v4
        if: env.SKIP_IOS != 'true'
        with:
          name: ios-unsigned-ipa
          # 两个目录都要传：未签名在 ipa/，ad-hoc 签名在 ipa-adhoc/。
          # 只写 ipa/*.ipa 会让 ad-hoc 产物既不上传 artifact 也不进 SHA256SUMS。
          path: |
            ipa/*.ipa
            ipa-adhoc/*.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Publish iOS IPA to Release
        if: ${{ env.SKIP_IOS != 'true' && env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(ls ipa/*.ipa ipa-adhoc/*.ipa 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::warning::没有可发布的 IPA"
            exit 0
          fi
          for f in $files; do
            gh release upload "$RELEASE_TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
            echo "已发布 $f"
          done

  ios-testflight:
    name: iOS signed IPA → TestFlight
    # 产出**可安装**的 IPA 并上传到 TestFlight，用户装 TestFlight 即可使用。
    #
    # 需要仓库 Secrets（创建方式见 docs/iOS打包指南.md）：
    #   APP_STORE_CONNECT_ISSUER_ID   App Store Connect 的 Issuer ID
    #   APP_STORE_CONNECT_KEY_ID      API Key 的 Key ID
    #   APP_STORE_CONNECT_KEY_CONTENT .p8 私钥的 base64
    #   APPLE_TEAM_ID                 开发者团队 ID
    # 以及 Apple Developer Program 账号（$99/年）。
    #
    # 签名用 xcodebuild 的 -allowProvisioningUpdates + API Key，
    # 由 Xcode 自己在开发者门户创建证书与描述文件，无需手动导入 p12。
    if: ${{ inputs.run_ios == 'true' && inputs.publish_testflight == 'true' }}
    needs: [ios]
    runs-on: macos-15
    timeout-minutes: 90
    environment: release
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 注意：runner 上下文只在 step 级可用，API_PRIVATE_KEYS_DIR 在各步骤里
      # 用 $RUNNER_TEMP 现场拼出，altool 会按文件名在该目录里找 AuthKey_<KeyID>.p8。
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          set -euo pipefail
          missing=""
          for v in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_CONTENT APPLE_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing"
            exit 1
          fi

      - name: Select Xcode
        run: |
          set -euo pipefail
          want="${{ inputs.xcode_version }}"
          if [ -n "$want" ]; then
            app=$(ls -d "/Applications/Xcode_${want}"*.app 2>/dev/null | sed -n "1p" || true)
            [ -n "$app" ] || { echo "::error::Xcode $want not installed"; exit 1; }
            sudo xcode-select -s "$app"
          fi
          xcodebuild -version

      - uses: ./.github/actions/setup-flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}

      - name: Restore App Store Connect key
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          # 私钥不能进 workspace，否则会被 artifact 通配符一起上传
          echo "key written to $API_PRIVATE_KEYS_DIR"

      - name: Prepare Xcode configuration
        working-directory: bili-lite/app
        run: |
          set -euo pipefail
          flutter pub get
          # 先生成 xcconfig，再由 xcodebuild 自行 archive
          flutter build ios --release --no-codesign \
            --build-number="${GITHUB_RUN_NUMBER}" --config-only
          cd ios && pod install && cd ..

      - name: Archive with automatic signing
        working-directory: bili-lite/app
        env:
          KEY_PATH: ${{ runner.temp }}/asc_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/BiliLite.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            | xcbeautify || exit ${PIPESTATUS[0]}

      - name: Export IPA
        run: |
          set -euo pipefail
          cp bili-lite/app/ios/ExportOptions.plist ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ExportOptions.plist
          mkdir -p build/ios/export
          xcodebuild -exportArchive \
            -archivePath bili-lite/app/build/ios/BiliLite.xcarchive \
            -exportPath build/ios/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify || exit ${PIPESTATUS[0]}
          ls -la build/ios/export/

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc_keys"
          ipa=$(ls build/ios/export/*.ipa | sed -n "1p")
          echo "uploading $ipa"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup private key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: build/ios/export/*.ipa
          if-no-files-found: warn
          retention-days: 30

  checksums:
    name: Checksums and publish
    # 汇总所有 job 的产物，统一生成 SHA256SUMS 并发布，
    # 避免校验和需要手工维护而与实际资产脱节。
    # ios 是 continue-on-error 的软失败：iOS 构建挂了不应该让其它端的
    # 校验和与发布一起停摆，所以这里用 always() 保住下游。
    needs: [android, windows, web, source, ios]
    if: ${{ always() && needs.android.result == 'success' && needs.windows.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect build artifacts
        run: |
          set -euo pipefail
          mkdir -p installers
          # 源码归档由 source job 产出，一并纳入校验和。
          find artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "bili-lite-web-v*" \
            -o -name "bili-lite-v*-src.*" -o -name "*.ipa" \) \
            -exec cp {} installers/ \;
          ls -la installers/

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd installers
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: installers/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Release
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" installers/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
