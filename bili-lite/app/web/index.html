<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bili Lite — 一个基于哔哩哔哩公开数据的简洁第三方客户端">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bili Lite">
  <meta name="theme-color" content="#FB7299">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Bili Lite · 简洁哔哩哔哩</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f6f7f9; }
    /* 引擎加载前的轻量占位，避免长时间白屏 */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #8a8f99; background: #f6f7f9; z-index: 9999;
      transition: opacity .35s ease;
    }
    #boot .logo {
      width: 52px; height: 52px; border-radius: 15px;
      background: #FB7299; color: #fff; display: flex;
      align-items: center; justify-content: center;
      font-size: 25px; font-weight: 700; letter-spacing: -1px;
      box-shadow: 0 8px 24px rgba(251,114,153,.28);
    }
    #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: #e8eaee; overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; background: #FB7299; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #boot { background: #121316; color: #8b8f98; }
      #boot .bar { background: #2a2c31; }
    }
  </style>

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="boot">
    <div class="logo">bi</div>
    <div style="font-size:15px;font-weight:600;letter-spacing:.5px">Bili Lite</div>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('load', function () {
      _flutter.loader.loadEntrypoint({
        serviceWorker: { serviceWorkerVersion: serviceWorkerVersion }
      }).then(function (engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function (appRunner) {
        var boot = document.getElementById('boot');
        if (boot) { boot.style.opacity = '0'; setTimeout(function(){ boot.remove(); }, 400); }
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
