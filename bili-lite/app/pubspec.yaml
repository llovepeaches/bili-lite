name: bililite
description: Bili Lite — 基于哔哩哔哩公开数据的简洁第三方多端客户端
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ">=2.17.0 <3.0.0"

# 依赖刻意保持极简：只用 http 与 shared_preferences，其余能力全部由 Flutter SDK 提供，
# 保证在较旧的 Flutter 3.0 / Dart 2.17 工具链上也能稳定编译到六个平台。
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^0.13.5
  shared_preferences: ^2.0.15
  url_launcher: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline.json
