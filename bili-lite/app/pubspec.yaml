name: bililite
description: Bili Lite — 基于哔哩哔哩公开数据的简洁第三方多端客户端
publish_to: 'none'
version: 1.5.0+5

environment:
  sdk: ">=2.17.0 <3.0.0"

# 依赖刻意保持极简：只用 http 与 shared_preferences，其余能力全部由 Flutter SDK 提供，
# 保证在较旧的 Flutter 3.0 / Dart 2.17 工具链上也能稳定编译到六个平台。
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  http: ^0.13.5
  # 必须 >=2.1.0：2.1.x 才是完整的 federated 实现，Windows / Linux /
  # macOS 都有原生插件。2.0.x 只有 Android / iOS / Web，桌面端会退化为
  # 无持久化能力（表现为「本地数据存不住」）。
  shared_preferences: ^2.1.0
  url_launcher: ^6.1.5
  video_player: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline.json
