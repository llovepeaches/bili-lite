org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 默认接管 Kotlin（内置 KGP，android.newDsl=true 亦为默认）。
# backdrop 2.0.1 的 Android 变体由 Kotlin 2.4.10 编译，若内置 KGP 低于该版本，
# 读它的 class 会报 "was compiled with an incompatible version of Kotlin"。
# 备选逃生门：android.newDsl=false + android.builtInKotlin=false + 显式 KGP 2.4.10
# （android.builtInKotlin=false 在 AGP 10 将被移除，仅作过渡）。
android.builtInKotlin=true

# compileSdk 37.0 超出 AGP 9.1.0 的测试上限，升级 AGP 后此告警消失；
# 若后续回退到旧 AGP，可打开下面这行压制告警。
# android.suppressUnsupportedCompileSdk=37.0
